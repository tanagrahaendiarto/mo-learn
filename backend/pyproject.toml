[project]
name = "molearn-backend"
version = "0.3.0"
description = "MoLearn biological entity search, profiles, and AI-assisted learning"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["live: hit real UniProt through the local app (run explicitly)"]
